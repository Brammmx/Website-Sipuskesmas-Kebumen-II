function prand(n){var x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
function gSeries(seed,b,a){var out=[];for(var i=0;i<12;i++){var season=1+a*Math.sin(i/12*6.283+(seed%628)/100);var noise=.85+.3*prand(seed+i*7);out.push(Math.max(0,Math.round(b*season*noise)));}return out;}
function kSerY(p,i,y){var c=KLP[p].comps[i],m=multFor(y);return gSeries(c.sd,c.b,c.a).map(function(v){return Math.round(v*m);});}
